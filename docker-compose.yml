services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: club_deportivo
      MYSQL_USER: club_user
      MYSQL_PASSWORD: boca
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init_db.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./datos_prueba.sql:/docker-entrypoint-initdb.d/02_datos.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: club_user
      DB_PASSWORD: boca
      DB_NAME: club_deportivo
    depends_on:
      db:
        condition: service_healthy
volumes:
  mysql_data: