  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Identificador entero positivo del recurso
      schema:
        type: integer
      example: 1

    Limit:
      name: _limit
      in: query
      description: Cantidad máxima de registros por página
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
      example: 10

    Offset:
      name: _offset
      in: query
      description: Desplazamiento desde el primer registro
      schema:
        type: integer
        minimum: 0
        default: 0
      example: 0

    NombreFilter:
      name: nombre
      in: query
      description: Búsqueda parcial e insensible a mayúsculas por nombre
      schema:
        type: string
      example: "Cancha 1"

    IdDeporteFilter:
      name: id_deporte
      in: query
      description: Filtrar por identificador de deporte
      schema:
        type: integer
      example: 1

    TechadaFilter:
      name: techada
      in: query
      description: Filtrar por indicador de cancha techada
      schema:
        type: boolean
      example: true

    ActivaFilter:
      name: activa
      in: query
      description: Filtrar por indicador de cancha activa
      schema:
        type: boolean
      example: true

    ActivoFilter:
      name: activo
      in: query
      description: Filtrar por indicador de socio activo
      schema:
        type: boolean
      example: true

    EstadoFilter:
      name: estado
      in: query
      description: Filtrar por estado de la reserva
      schema:
        type: string
        enum:
          - confirmada
          - cancelada
          - finalizada
      example: "confirmada"

    IdCanchaFilter:
      name: id_cancha
      in: query
      description: Filtrar por identificador de cancha
      schema:
        type: integer
      example: 2

    IdSocioFilter:
      name: id_socio
      in: query
      description: Filtrar por identificador de socio
      schema:
        type: integer
      example: 1

    FechaDesdeFilter:
      name: fecha_desde
      in: query
      description: Fecha inicial del rango inclusive
      schema:
        type: string
        format: date
      example: "2026-10-01"

    FechaHastaFilter:
      name: fecha_hasta
      in: query
      description: Fecha final del rango inclusive
      schema:
        type: string
        format: date
      example: "2026-10-31"

    FechaRequired:
      name: fecha
      in: query
      required: true
      description: Día para consultar disponibilidad
      schema:
        type: string
        format: date
      example: "2026-10-15"

    HoraInicioRequired:
      name: hora_inicio
      in: query
      required: true
      description: Hora de inicio del intervalo
      schema:
        type: string
        pattern: '^([01]\d|2[0-3]):00:00$'
      example: "18:00:00"

    HoraFinRequired:
      name: hora_fin
      in: query
      required: true
      description: Hora de fin del intervalo
      schema:
        type: string
        pattern: '^([01]\d|2[0-3]):00:00$'
      example: "20:00:00"

    FechaBloqueoFilter:
      name: fecha
      in: query
      description: Filtrar bloqueos por día
      schema:
        type: string
        format: date
      example: "2026-10-20"

