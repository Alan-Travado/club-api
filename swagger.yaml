openapi: 3.0.3
info:
  title: API club deportivo encuentro
  description: especializacion OpenAPI para la gestion de canchas, socios y reservas.
  version: 1.0.0
servers:
  - url: https://localhost:5000
    description: servidor local 
paths:
  /deportes:
    get:
      summary: consultar los deportes precargados
      responses: 
         '200':
           description: lista de deportes

  /canchas: 
    get:
     summary:
     parameters:
        - name: _limit
          in: query
          schema:
            type: integer
            default: 10
        - name: _offeset
          in: query
          schema:
            type: integer
            default: 0
        - name: id_deporte
          in: query
          schema:
            type: integer
        - name: nombre
          in: query
          schema:
            type: string
        - name: techada
          in: query
          schema:
            type: boolean
        - name: activa
          in: query
          schema:
            type: boolean
    responses:
         '200':
          description: listado paginado de canchas
post:
  summary: crear una cancha
  requestBody:
    required: true
    content:
      application/json:
       schema:
         type: object
         required: [nombre, id_deporte, precio_hora]
         properties:
           nombre:
            type: string
           id_deporte:
            type: integer
           precio_hora:
            type: integer
           techada:
            type: boolean
            default: false
           activa:
            type: boolean
            default: true
  responses:
    '201':
      description: cancha creada exitosamente
/cancha/{id}:
  get:
   summary: obtener datos de una cancha
   parameters:
    - name: id
      in: path
      required: true
      schema: 
       type: integer
   responses:
     '200':
       description: datos de la cancha
  patch:
  summary: actualizar parcialmente una cancha
  parameters:
     - name: id
       in: path
       required: true
       schema: 
        type: integer
  responses:
    '200':
      description: cancha actualizada
delete:
  summary: eliminar una cancha sin reservas asociadas
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
  responses: 
    '204':
       description: cancha eliminada
    '409':
      description: conflicto - la cancha tiene reservas asociadas

/canchas/disponibles:
  get:
    summary: consultar canchas activas libres en un intervalo
    parameters: 
      - name: fecha
        in: query
        required: true
        schema:
          type: string
      - name: hora_inicio
        in: query
        required: true
        schema:
          type: string
      - name: hora_fin
        in: query
        required: true
        schema:
          type: string
    responses:
      '200':
        description: lista de canchas disponibles

/socios:
  get: 
    summary: listar socios con paginacion
    responses: 
       '200':
         description: lista de socios
  post:
    summary: registrar un socio
    requestBody:
     required: true
     content:
       application/json:
        schema:
          type: object
          required: [nombre, email]
          properties:
            nombre:
              type: string
            email:
              type: string
    responses:
      '201':
        description: socio registrado
      '409':
        description: correo ya registrado
    
/reservas:
  get:
    summary: listar reservas con paginacion
    responses:
      '200':
        description: lista de reservas
  post:
    summary: crear una reserva
    requestBody:
      required: true
      content:
        application/json:
         schema:
           type: object
           required: [id_socio, id_cancha, fehca_hora_inicio, fecha_hora_fin]
           properties:
             id_socio:
               type: integer
             id_cancha:
               type: integer
             fecha_hora_inicio:
               type: string
               example: "2026-10-15T18:00:00.000000-03:00"
             fecha_hora_fin:
                type: string
                example: "2026-10-15T20:00:00.000000-03:00"
    responses:
      '201':
        description: reserva creada
      '409':
        description: conflicto por superposicion de horarios o inactividad

/reservas/{id}/estado:
  put: 
    summary: cambiar el estado de una reserva
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [estado]
            properties:
              estado:
                type: string
                enum: [confirmada, cancelada, finalizado]
  responses:
    '200':
      description: estado actualizado
    '400':
      description: estado desconocido
    '409':
      description: transicion de estado no permitida